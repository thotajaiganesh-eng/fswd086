
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saved Blood Bank Data</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff5f5;
}

header {
    background: #b30000;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
}

.container {
    width: 95%;
    margin: 30px auto;
}

.section {
    background: white;
    margin-bottom: 30px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px #ccc;
    overflow-x: auto;
}

h2 {
    color: #b30000;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th {
    background: #b30000;
    color: white;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
}

.delete {
    background: red;
    color: white;
    border: none;
    padding: 7px 12px;
    border-radius: 5px;
    cursor: pointer;
}

.delete:hover {
    background: darkred;
}

.back {
    background: white;
    color: #b30000;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    cursor: pointer;
    margin-top: 10px;
}

.clear {
    background: #333;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

</style>

</head>

<body>

<header>

<h1>🩸 Saved Blood Bank Data</h1>

<button class="back" onclick="goBack()">
    Back to Website
</button>

</header>


<div class="container">


<!-- DONORS -->

<div class="section">

<h2>❤️ Registered Donors</h2>

<table>

<thead>

<tr>
<th>Name</th>
<th>Age</th>
<th>Blood Group</th>
<th>Phone</th>
<th>City</th>
<th>Date</th>
<th>Action</th>
</tr>

</thead>

<tbody id="donorTable">
</tbody>

</table>

</div>


<!-- BLOOD REQUESTS -->

<div class="section">

<h2>🩸 Blood Requests</h2>

<table>

<thead>

<tr>
<th>Patient</th>
<th>Blood Group</th>
<th>Units</th>
<th>Hospital</th>
<th>Contact</th>
<th>Date</th>
<th>Action</th>
</tr>

</thead>

<tbody id="requestTable">
</tbody>

</table>

</div>


<!-- EMERGENCY -->

<div class="section">

<h2>🚨 Emergency Requests</h2>

<table>

<thead>

<tr>
<th>Patient</th>
<th>Blood Group</th>
<th>Hospital</th>
<th>Contact</th>
<th>Details</th>
<th>Date</th>
<th>Action</th>
</tr>

</thead>

<tbody id="emergencyTable">
</tbody>

</table>

</div>


<center>

<button class="clear" onclick="clearAllData()">
    Clear All Saved Data
</button>

</center>

</div>


<script>

/* Go back to main website */

function goBack() {
    window.location.href = "index.html";
}


/* Display Donors */

function displayDonors() {

    let donors =
        JSON.parse(localStorage.getItem("donors")) || [];

    let table =
        document.getElementById("donorTable");

    table.innerHTML = "";

    if (donors.length === 0) {

        table.innerHTML =
            "<tr><td colspan='7'>No donor data found</td></tr>";

        return;
    }

    donors.forEach((donor, index) => {

        table.innerHTML += `

        <tr>

            <td>${donor.name}</td>

            <td>${donor.age}</td>

            <td>${donor.blood}</td>

            <td>${donor.phone}</td>

            <td>${donor.city}</td>

            <td>${donor.date}</td>

            <td>
                <button
                    class="delete"
                    onclick="deleteDonor(${index})">
                    Delete
                </button>
            </td>

        </tr>

        `;
    });
}


/* Display Blood Requests */

function displayRequests() {

    let requests =
        JSON.parse(
            localStorage.getItem("bloodRequests")
        ) || [];

    let table =
        document.getElementById("requestTable");

    table.innerHTML = "";

    if (requests.length === 0) {

        table.innerHTML =
            "<tr><td colspan='7'>No blood requests found</td></tr>";

        return;
    }

    requests.forEach((request, index) => {

        table.innerHTML += `

        <tr>

            <td>${request.patient}</td>

            <td>${request.blood}</td>

            <td>${request.units}</td>

            <td>${request.hospital}</td>

            <td>${request.contact}</td>

            <td>${request.date}</td>

            <td>
                <button
                    class="delete"
                    onclick="deleteRequest(${index})">
                    Delete
                </button>
            </td>

        </tr>

        `;
    });
}


/* Display Emergency Requests */

function displayEmergencies() {

    let emergencies =
        JSON.parse(
            localStorage.getItem("emergencies")
        ) || [];

    let table =
        document.getElementById("emergencyTable");

    table.innerHTML = "";

    if (emergencies.length === 0) {

        table.innerHTML =
            "<tr><td colspan='7'>No emergency requests found</td></tr>";

        return;
    }

    emergencies.forEach((emergency, index) => {

        table.innerHTML += `

        <tr>

            <td>${emergency.patient}</td>

            <td>${emergency.blood}</td>

            <td>${emergency.hospital}</td>

            <td>${emergency.contact}</td>

            <td>${emergency.details}</td>

            <td>${emergency.date}</td>

            <td>
                <button
                    class="delete"
                    onclick="deleteEmergency(${index})">
                    Delete
                </button>
            </td>

        </tr>

        `;
    });
}


/* Delete Donor */

function deleteDonor(index) {

    let donors =
        JSON.parse(localStorage.getItem("donors")) || [];

    let bloodGroup =
        donors[index].blood;

    donors.splice(index, 1);

    localStorage.setItem(
        "donors",
        JSON.stringify(donors)
    );


    /* Reduce stock when donor is deleted */

    let stock =
        JSON.parse(
            localStorage.getItem("bloodStock")
        ) || {};

    if (stock[bloodGroup] > 0) {
        stock[bloodGroup]--;
    }

    localStorage.setItem(
        "bloodStock",
        JSON.stringify(stock)
    );

    displayDonors();
}


/* Delete Blood Request */

function deleteRequest(index) {

    let requests =
        JSON.parse(
            localStorage.getItem("bloodRequests")
        ) || [];

    let bloodGroup =
        requests[index].blood;

    let units =
        requests[index].units;

    requests.splice(index, 1);

    localStorage.setItem(
        "bloodRequests",
        JSON.stringify(requests)
    );


    /* Return requested blood to stock */

    let stock =
        JSON.parse(
            localStorage.getItem("bloodStock")
        ) || {};

    stock[bloodGroup] =
        (stock[bloodGroup] || 0) + units;

    localStorage.setItem(
        "bloodStock",
        JSON.stringify(stock)
    );

    displayRequests();
}


/* Delete Emergency */

function deleteEmergency(index) {

    let emergencies =
        JSON.parse(
            localStorage.getItem("emergencies")
        ) || [];

    emergencies.splice(index, 1);

    localStorage.setItem(
        "emergencies",
        JSON.stringify(emergencies)
    );

    displayEmergencies();
}


/* Clear Everything */

function clearAllData() {

    let confirmDelete =
        confirm(
            "Are you sure you want to delete all saved data?"
        );

    if (!confirmDelete) {
        return;
    }

    localStorage.removeItem("donors");
    localStorage.removeItem("bloodRequests");
    localStorage.removeItem("emergencies");
    localStorage.removeItem("bloodStock");

    displayDonors();
    displayRequests();
    displayEmergencies();

    alert("All saved data has been deleted.");
}


/* Load Data */

displayDonors();
displayRequests();
displayEmergencies();

</script>

</body>
</html>
